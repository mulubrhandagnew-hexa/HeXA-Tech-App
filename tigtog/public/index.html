<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14111f" />
  <meta name="description" content="Tigtog — make and share music and videos in Tigrinya and Amharic." />
  <title>Tigtog</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f5a524'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%2314111f'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span>tigtog</a>
    <nav class="tabs" id="tabs">
      <a href="#/" data-tab="for-you" data-i18n="forYou">For you</a>
      <a href="#/following" data-tab="following" data-i18n="following">Following</a>
    </nav>
    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" data-i18n-placeholder="searchPlaceholder" aria-label="Search" />
    </form>
    <select id="ui-lang" class="lang-switch" aria-label="Language / ቋንቋ"></select>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="bottombar">
    <a href="#/" data-nav="home"><b aria-hidden="true">⌂</b><span data-i18n="home">Home</span></a>
    <a href="#/search" data-nav="search"><b aria-hidden="true">⌕</b><span data-i18n="search">Search</span></a>
    <button id="create-btn" class="create" aria-haspopup="menu" aria-label="Create">＋</button>
    <a href="#/studio" data-nav="studio"><b aria-hidden="true">♫</b><span data-i18n="studio">Studio</span></a>
    <a href="#/me" data-nav="me"><b aria-hidden="true">◉</b><span data-i18n="me">Me</span></a>
  </nav>

  <!-- Create menu -->
  <dialog id="create-dialog" class="drawer">
    <div class="sheet create-menu">
      <a href="#/studio" class="big-choice" data-close>
        <span class="emoji" aria-hidden="true">♫</span>
        <span><b data-i18n="makeSong">Make a song</b><small data-i18n="studioIntro"></small></span>
      </a>
      <button type="button" class="big-choice" id="open-upload">
        <span class="emoji" aria-hidden="true">⬆</span>
        <span><b data-i18n="uploadVideo">Upload a video</b><small data-i18n="chooseVideo"></small></span>
      </button>
      <button type="button" class="close" data-close aria-label="Close">✕</button>
    </div>
  </dialog>

  <!-- Auth dialog -->
  <dialog id="auth-dialog">
    <form method="dialog" id="auth-form" class="sheet">
      <h2 id="auth-title">Log in to Tigtog</h2>
      <label><span data-i18n="username">Username</span> <input name="username" autocomplete="username" required minlength="3" maxlength="24" autocapitalize="off" /></label>
      <label id="display-row" hidden><span data-i18n="displayName">Display name</span> <input name="displayName" maxlength="50" class="fidel-able" /></label>
      <label><span data-i18n="password">Password</span> <input name="password" type="password" autocomplete="current-password" required minlength="8" /></label>
      <p class="error" id="auth-error" role="alert"></p>
      <button class="primary" type="submit" id="auth-submit">Log in</button>
      <p class="muted">
        <span id="auth-switch-text">New here?</span>
        <button type="button" class="link" id="auth-switch">Create an account</button>
      </p>
      <button type="button" class="close" data-close aria-label="Close">✕</button>
    </form>
  </dialog>

  <!-- Upload dialog -->
  <dialog id="upload-dialog">
    <form method="dialog" id="upload-form" class="sheet">
      <h2 data-i18n="postVideo">Post a video</h2>
      <label class="drop">
        <input type="file" name="file" accept="video/mp4,video/webm,video/quicktime" required />
        <video id="upload-preview" muted playsinline loop hidden></video>
        <span id="drop-hint" data-i18n="chooseVideo">Choose an MP4, WebM or MOV video</span>
      </label>
      <div class="fields">
        <label><span data-i18n="language">Language</span>
          <select name="language">
            <option value="ti" data-i18n="ti">ትግርኛ</option>
            <option value="am" data-i18n="am">አማርኛ</option>
            <option value="other" data-i18n="other">Other</option>
          </select>
        </label>
        <label><span data-i18n="kind">Type</span>
          <select name="kind">
            <option value="video" data-i18n="video">Video</option>
            <option value="music" data-i18n="music">Music</option>
          </select>
        </label>
      </div>
      <label><span data-i18n="caption">Caption</span> <textarea name="caption" maxlength="500" rows="3" data-i18n-placeholder="captionPlaceholder" class="fidel-able"></textarea></label>
      <div class="fidel-slot"></div>
      <p class="error" id="upload-error" role="alert"></p>
      <button class="primary" type="submit" id="upload-submit" data-i18n="post">Post</button>
      <button type="button" class="close" data-close aria-label="Close">✕</button>
    </form>
  </dialog>

  <!-- Comments drawer -->
  <dialog id="comments-dialog" class="drawer">
    <div class="sheet">
      <h2 id="comments-count">Comments</h2>
      <ul id="comments-list" class="comments"></ul>
      <div class="fidel-slot"></div>
      <form id="comment-form" class="comment-form">
        <input name="text" maxlength="300" data-i18n-placeholder="addComment" required autocomplete="off" class="fidel-able" />
        <button class="primary" type="submit" data-i18n="send">Send</button>
      </form>
      <button type="button" class="close" data-close aria-label="Close">✕</button>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
